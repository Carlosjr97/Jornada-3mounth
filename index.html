<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

</head>

<body>
<main class="tela-inicial"> <!-- Conteúdo principal da tela, classe CSS para a main -->
    <!-- aqui em baixo estamos declarando uma imagem para a tela 
    src = usamos src para o caminho da imagem 
    alt = usamos alt para descrever imagem
    class capa-jogo mais uma classe, agora para a imagem
    -->
    <img 
        src="assets/capa.png"
        alt="Capa do jogo"
        class="capa-jogo" 
        >
    <button id="btnPlay" onclick="window.location.href='tela2.html'"> <!-- Criando botão usamos btnPlay para identificar o botão -->
        ▶ JOGAR <!-- conteúdo do botão -->
    </button> <!-- fechamento do botão -->
</main> <!-- fechamento da main conteúdo principal -->

<script src="script.js"></script> <!-- linkando com o arquivo javascript -->
</body>
</html>
